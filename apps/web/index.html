<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/KioLogo.ico" />
    <!-- logo.png (15 KB) y no LogoFavi.png (246 KB): un icono de pestana no
         justifica un cuarto de mega en la primera visita. -->
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Base. El <title> y la descripción describen la landing porque es la
         única ruta que un desconocido alcanza sin sesión; el resto de la SPA
         va tras autenticación y no se comparte por enlace. -->
    <title>Kio Health — Gestión clínica para psicólogos</title>
    <meta
      name="description"
      content="Agenda, sesión, nota clínica y cobro en un solo recorrido. Las notas y los datos de contacto del paciente se guardan cifrados con AES-256-GCM. En beta cerrada."
    />
    <link rel="canonical" href="https://kioind.com/" />

    <!-- La barra del navegador acompaña al tema, en vez de quedarse en blanco
         sobre el suelo slate. Los valores son los de DESIGN.md: lino cálido en
         claro, noche base en oscuro. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f3ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />

    <!-- Open Graph. Sin esto, la invitación a la beta se comparte por WhatsApp
         o LinkedIn como una tarjeta vacía: el enlace es el canal principal de
         una beta cerrada, así que la vista previa es parte del producto.
         og:image tiene que ser absoluta — los scrapers no resuelven rutas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kio Health" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://kioind.com/" />
    <meta property="og:title" content="Kio Health — Gestión clínica para psicólogos" />
    <meta
      property="og:description"
      content="Agenda, sesión, nota clínica y cobro en un solo recorrido. Las notas y los datos de contacto del paciente se guardan cifrados con AES-256-GCM. En beta cerrada."
    />
    <meta property="og:image" content="https://kioind.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kio Health. Agenda, sesión, nota y cobro son un solo recorrido."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kio Health — Gestión clínica para psicólogos" />
    <meta
      name="twitter:description"
      content="Agenda, sesión, nota clínica y cobro en un solo recorrido. Las notas y los datos de contacto del paciente se guardan cifrados con AES-256-GCM. En beta cerrada."
    />
    <meta name="twitter:image" content="https://kioind.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="Kio Health. Agenda, sesión, nota y cobro son un solo recorrido."
    />

    <!-- Aqui habia una hoja de estilos de Google Fonts con Inter y Roboto.
         Se quito el 15-09-2026 y conviene saber por que antes de reponerla:
         bloqueaba el primer pintado con dos conexiones a un dominio ajeno, y
         ninguna de las dos familias se aplicaba en ningun sitio — solo existian
         como variables --font-inter y --font-roboto que nadie referenciaba. Era
         peaje sin contrapartida, y se pagaba justo en el momento mas caro: la
         primera visita de alguien que llega desde un anuncio.
         Si algun dia se usan de verdad, que entren por self-hosting con
         font-display:swap, no por un <link> que bloquea. -->
  </head>
  <body>
    <!--
    THESIS: la landing no ilustra el producto, lo conduce. Rechaza el hero con
    rejilla de features y capturas decorativas: el visor de la app ES el primer
    viewport, y la copy cuelga de cada paso del ciclo de sesión.
    OWN-WORLD: el sistema de Kio sin cambios — lino cálido #f5f3ef y suelo slate
    #020617, púrpura escaso, superficies planas separadas por borde de 1px,
    radios blandos, versalitas espaciadas como etiqueta, iconos Lucide.
    STORY: un psicólogo entiende que agenda, sesión, nota y cobro son un solo
    recorrido, ve que las notas van cifradas, y pide acceso a la beta.
    FIRST VIEWPORT: a la izquierda titular, subtítulo y formulario de lista de
    espera; a la derecha el visor con la captura real y el riel de cuatro pasos
    bajo él. Acción primaria visible sin desplazar.
    FORM: demo conducida, candidato 3 de la lista ordenada; seed 40bc9d8e.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <!--
      HERO DE ARRANQUE. Es la primera pantalla escrita a mano en HTML plano, y
      se borra sola en cuanto React monta (createRoot vacia #root).

      Por que existe: el 8 de septiembre de 2026 una campana de Instagram trajo
      76 visitas y la mediana de permanencia fue de 0,6 segundos, con el 96%
      sin pasar de la primera pantalla. Hasta que React montaba, lo que esa
      gente veia era un rectangulo en blanco — habian pagado por traerles a una
      pagina vacia. Esto pone el titular, la promesa y el boton delante del
      visitante en el primer pintado, sin esperar a ningun JavaScript.

      Reglas si se toca:
      - Los estilos van EN LINEA a proposito. Depender de index.css lo
        devolveria al camino critico y anularia el proposito.
      - El texto debe coincidir con el <h1> y el <p> de LandingPage.tsx. Si
        divergen, el visitante ve un cambio de mensaje al montar React, que es
        peor que la pantalla en blanco.
      - Las medidas buscan que el salto sea imperceptible, no que sea idéntico.
    -->
    <div id="root">
      <div
        style="
          min-height: 100vh;
          background: #f5f3ef;
          color: #213547;
          font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        "
      >
        <div
          style="
            height: 64px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            border-bottom: 1px solid #e5e7eb;
          "
        >
          <img src="/logo.png" alt="" width="32" height="32" style="object-fit: contain" />
          <span style="font-weight: 700; font-size: 16px">Health</span>
        </div>

        <div style="max-width: 1152px; margin: 0 auto; padding: 48px 16px 0">
          <h1
            style="
              max-width: 16ch;
              font-size: 36px;
              line-height: 1.08;
              letter-spacing: -0.03em;
              font-weight: 700;
              margin: 0;
            "
          >
            Agenda, sesión, nota y cobro son
            <span style="color: #5b46a8">un solo recorrido</span>
          </h1>
          <p
            style="
              margin: 20px 0 0;
              max-width: 46ch;
              font-size: 16px;
              line-height: 1.75;
              font-weight: 500;
              color: #64748b;
            "
          >
            Kio Health es la plataforma de gestión clínica para psicólogos.
            Agendas, preparas la sesión, documentas y cobras en el mismo sitio —
            y lo que escribes sobre un paciente se guarda cifrado.
          </p>
          <div
            style="
              margin-top: 28px;
              height: 48px;
              max-width: 420px;
              border-radius: 12px;
              background: rgba(100, 116, 139, 0.12);
            "
          ></div>
        </div>
      </div>
    </div>
    <style>
      @media (prefers-color-scheme: dark) {
        #root > div[style] {
          background: #020617 !important;
          color: #f8fafc !important;
        }
        #root > div[style] > div[style] {
          border-bottom-color: #1e293b !important;
        }
        #root h1 span {
          color: #ae93fe !important;
        }
        #root p {
          color: #94a3b8 !important;
        }
      }
      @media (min-width: 640px) {
        #root h1 {
          font-size: 48px !important;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
